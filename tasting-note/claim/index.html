<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner Check</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; margin: 0; padding: 24px; background: #f7f8fa; color: #111; }
        .container { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p.desc { margin: 0 0 20px; color: #4b5563; font-size: 14px; }
        form { display: flex; flex-direction: column; gap: 12px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: #374151; }
        input { padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: #0a84ff; box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }
        .or { text-align: center; color: #6b7280; font-size: 12px; }
        .actions { display: flex; gap: 8px; align-items: center; }
        button { background: #0a84ff; color: #fff; border: 0; padding: 12px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .hint { font-size: 12px; color: #6b7280; }
        .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
        .success { color: #065f46; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
        .result { margin-top: 12px; }
        .small { font-size: 12px; color: #6b7280; }
        .footer { margin-top: 24px; font-size: 12px; color: #6b7280; text-align: center; }
        a { color: #0a84ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Check Winner Status</h1>
        <p class="desc">Enter your email or phone number to check your winner status. If found, you'll be redirected to the extension request form.</p>

        <form id="checkForm">
            <div class="field">
                <label for="email">Email (optional)</label>
                <input id="email" name="email" type="email" placeholder="example@gmail.com" inputmode="email" autocomplete="email">
            </div>
            <div class="or">or</div>
            <div class="field">
                <label for="phone">Phone number (optional)</label>
                <input id="phone" name="phone" type="tel" placeholder="000-000-0000" inputmode="tel" autocomplete="tel">
                <div class="hint">Auto-formatted to 000-000-0000 (or 1-000-000-0000).</div>
            </div>
            <div class="actions">
                <button type="submit" id="submitBtn">Check</button>
                <span id="loadingText" class="small" style="display:none;">Checking…</span>
            </div>
            <div id="message" class="result" aria-live="polite"></div>
        </form>

        <div class="footer">If issues persist, please contact the staff.</div>
    </div>

    <script>
        (function() {
            var form = document.getElementById('checkForm');
            var emailInput = document.getElementById('email');
            var phoneInput = document.getElementById('phone');
            var submitBtn = document.getElementById('submitBtn');
            var loadingText = document.getElementById('loadingText');
            var messageEl = document.getElementById('message');

            var ENDPOINT = 'https://tally-to-d1.gyulkiller.workers.dev/winners/check';
            var TALLY_URL = 'https://tally.so/r/3ERG9r';

            function normalizePhone(phone) {
                if (!phone) return '';
                var cleaned = String(phone).replace(/[^0-9+]/g, '');
                return cleaned;
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                loadingText.style.display = isLoading ? 'inline' : 'none';
            }

            function showMessage(type, text) {
                messageEl.className = 'result ' + (type === 'error' ? 'error' : 'success');
                messageEl.textContent = text;
            }

            // Auto-format phone to Canadian style: 000-000-0000 (supports leading 1-)
            function formatPhoneCA(value) {
                var digits = String(value || '').replace(/\D/g, '');
                var country = '';
                var rest = digits;
                if (rest.length > 1 && rest.charAt(0) === '1') {
                    country = '1';
                    rest = rest.slice(1);
                }
                var part1 = rest.slice(0, 3);
                var part2 = rest.slice(3, 6);
                var part3 = rest.slice(6, 10);
                var formatted = '';
                if (country) formatted = country + '-';
                if (rest.length <= 3) {
                    formatted += part1;
                } else if (rest.length <= 6) {
                    formatted += part1 + '-' + part2;
                } else {
                    formatted += part1 + '-' + part2 + '-' + part3;
                }
                return formatted;
            }

            function applyPhoneMask() {
                var cur = phoneInput.value || '';
                var next = formatPhoneCA(cur);
                if (cur !== next) {
                    phoneInput.value = next;
                }
            }
            phoneInput.addEventListener('input', applyPhoneMask);
            phoneInput.addEventListener('blur', applyPhoneMask);

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                messageEl.textContent = '';
                messageEl.className = 'result';

                var email = (emailInput.value || '').trim();
                var phoneRaw = (phoneInput.value || '').trim();
                var phone = normalizePhone(phoneInput.value || '');

                if (!email && !phone) {
                    showMessage('error', 'Please enter either email or phone number.');
                    return;
                }

                var url = new URL(ENDPOINT);
                if (email) {
                    url.searchParams.set('email', email);
                }
                if (phoneRaw) {
                    url.searchParams.set('phone', phoneRaw);
                }

                setLoading(true);
                fetch(url.toString(), { method: 'GET' })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        // Expected shape now includes: { ok, identity, found, count, email, phone, name, latest }
                        if (data && data.ok === true && data.found === true && data.latest) {
                            // If status is already finalized, show an English message instead of redirecting
                            var status = (data.latest.claimStatus || '').toLowerCase();
                            if (status === 'claimed') {
                                showMessage('success', 'You have already claimed your prize.');
                                return;
                            }
                            if (status === 'passed') {
                                showMessage('success', 'You have already passed on this prize.');
                                return;
                            }
                            if (status === 'extended') {
                                showMessage('success', 'Your extension request has already been submitted.');
                                return;
                            }

                            // Otherwise, redirect with params: email, name, phone
                            var target = new URL(TALLY_URL);
                            var emailParam = data.email || email || '';
                            var nameParam = data.name || '';
                            var phoneParam = phoneRaw || data.phone || '';
                            if (emailParam) target.searchParams.set('email', emailParam);
                            if (nameParam) target.searchParams.set('name', nameParam);
                            if (phoneParam) target.searchParams.set('phone', phoneParam);
                            window.location.href = target.toString();
                            return;
                        }

                        // Not found or latest is null
                        showMessage('error', 'No match found. Please check your information.');
                    })
                    .catch(function(err) {
                        showMessage('error', 'An error occurred. Please try again later.');
                    })
                    .finally(function() { setLoading(false); });
            });
        })();
    </script>
</body>
</html>

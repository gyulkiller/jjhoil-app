<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winners</title>
    <script src="../../i18n.js"></script>
    <meta name="theme-color" content="#0b0b0b" />
    <style>
      :root {
        --background: oklch(1.0000 0 0);
        --foreground: oklch(0.2686 0 0);
        --card: oklch(1.0000 0 0);
        --card-foreground: oklch(0.2686 0 0);
        --popover: oklch(1.0000 0 0);
        --popover-foreground: oklch(0.2686 0 0);
        --primary: oklch(0.7686 0.1647 70.0804);
        --primary-foreground: oklch(0 0 0);
        --secondary: oklch(0.9670 0.0029 264.5419);
        --secondary-foreground: oklch(0.4461 0.0263 256.8018);
        --muted: oklch(0.9846 0.0017 247.8389);
        --muted-foreground: oklch(0.5510 0.0234 264.3637);
        --accent: oklch(0.9869 0.0214 95.2774);
        --accent-foreground: oklch(0.4732 0.1247 46.2007);
        --destructive: oklch(0.6368 0.2078 25.3313);
        --destructive-foreground: oklch(1.0000 0 0);
        --border: oklch(24.776% 0.00003 271.152);
        --input: oklch(0.9276 0.0058 264.5313);
        --ring: oklch(0.7686 0.1647 70.0804);
        --chart-1: oklch(0.7686 0.1647 70.0804);
        --chart-2: oklch(0.6658 0.1574 58.3183);
        --chart-3: oklch(0.5553 0.1455 48.9975);
        --chart-4: oklch(0.4732 0.1247 46.2007);
        --chart-5: oklch(0.4137 0.1054 45.9038);
        --sidebar: oklch(0.9846 0.0017 247.8389);
        --sidebar-foreground: oklch(0.2686 0 0);
        --sidebar-primary: oklch(0.7686 0.1647 70.0804);
        --sidebar-primary-foreground: oklch(1.0000 0 0);
        --sidebar-accent: oklch(0.9869 0.0214 95.2774);
        --sidebar-accent-foreground: oklch(0.4732 0.1247 46.2007);
        --sidebar-border: oklch(0.9276 0.0058 264.5313);
        --sidebar-ring: oklch(0.7686 0.1647 70.0804);
        --font-sans: Inter, sans-serif;
        --font-serif: Source Serif 4, serif;
        --font-mono: JetBrains Mono, monospace;
        --radius: 0.375rem;
        --shadow-2xs: 0px 4px 8px -1px hsl(0 0% 0% / 0.05);
        --shadow-xs: 0px 4px 8px -1px hsl(0 0% 0% / 0.05);
        --shadow-sm: 0px 4px 8px -1px hsl(0 0% 0% / 0.10), 0px 1px 2px -2px hsl(0 0% 0% / 0.10);
        --shadow: 0px 4px 8px -1px hsl(0 0% 0% / 0.10), 0px 1px 2px -2px hsl(0 0% 0% / 0.10);
        --shadow-md: 0px 4px 8px -1px hsl(0 0% 0% / 0.10), 0px 2px 4px -2px hsl(0 0% 0% / 0.10);
        --shadow-lg: 0px 4px 8px -1px hsl(0 0% 0% / 0.10), 0px 4px 6px -2px hsl(0 0% 0% / 0.10);
        --shadow-xl: 0px 4px 8px -1px hsl(0 0% 0% / 0.10), 0px 8px 10px -2px hsl(0 0% 0% / 0.10);
        --shadow-2xl: 0px 4px 8px -1px hsl(0 0% 0% / 0.25);
      }
      .dark {
        --background: oklch(0.2046 0 0);
        --foreground: oklch(0.9219 0 0);
        --card: oklch(0.2686 0 0);
        --card-foreground: oklch(0.9219 0 0);
        --popover: oklch(0.2686 0 0);
        --popover-foreground: oklch(0.9219 0 0);
        --primary: oklch(0.7686 0.1647 70.0804);
        --primary-foreground: oklch(0 0 0);
        --secondary: oklch(0.2686 0 0);
        --secondary-foreground: oklch(0.9219 0 0);
        --muted: oklch(0.2686 0 0);
        --muted-foreground: oklch(0.7155 0 0);
        --accent: oklch(0.4732 0.1247 46.2007);
        --accent-foreground: oklch(0.9243 0.1151 95.7459);
        --destructive: oklch(0.6368 0.2078 25.3313);
        --destructive-foreground: oklch(1.0000 0 0);
        --border: oklch(0.3715 0 0);
        --input: oklch(0.3715 0 0);
        --ring: oklch(0.7686 0.1647 70.0804);
        --chart-1: oklch(0.8369 0.1644 84.4286);
        --chart-2: oklch(0.6658 0.1574 58.3183);
        --chart-3: oklch(0.4732 0.1247 46.2007);
        --chart-4: oklch(0.5553 0.1455 48.9975);
        --chart-5: oklch(0.4732 0.1247 46.2007);
        --sidebar: oklch(0.1684 0 0);
        --sidebar-foreground: oklch(0.9219 0 0);
        --sidebar-primary: oklch(0.7686 0.1647 70.0804);
        --sidebar-primary-foreground: oklch(1.0000 0 0);
        --sidebar-accent: oklch(0.4732 0.1247 46.2007);
        --sidebar-accent-foreground: oklch(0.9243 0.1151 95.7459);
        --sidebar-border: oklch(0.3715 0 0);
        --sidebar-ring: oklch(0.7686 0.1647 70.0804);
      }
      /* legacy variable mapping for this page */
      :root {
        --bg: var(--background);
        --text: var(--foreground);
        --panel: var(--card);
        --panel-2: var(--card);
        --muted: var(--muted-foreground);
        --accent: var(--accent);
        --success: var(--primary);
        --danger: var(--destructive);
        --border: var(--border);
        --ring: var(--ring);
      }

      html, body { height: 100%; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px clamp(16px, 3vw, 32px) 56px;
      }

      header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        text-align: center;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: -0.02em;
        font-weight: 700;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        margin-top: 12px;
        align-self: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 10px 30px rgba(0,0,0,0.35);
      }
      .pill { background: var(--glass); border: 1px solid var(--border); box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 10px 30px rgba(0,0,0,0.35); }
      .hour-block { padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04)); box-shadow: 0 6px 18px rgba(0,0,0,0.28); margin-bottom: 12px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
      .hour-block:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(0,0,0,0.34); }
      .hour-block.latest { box-shadow: 0 8px 24px rgba(0,0,0,0.35); border-color: rgba(158,197,255,0.45); }
      .hour-title { font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; font-size: clamp(16px, 2vw, 18px); color: var(--text); }

      /* Oil rows styled blocks */
      .oil-row {
        position: relative;
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.82));
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px 10px 26px;
        margin: 10px 0;
      }
      .oil-row::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 10px;
        bottom: 10px;
        width: 8px;
        border-radius: 3px;
        background: var(--border);
      }
      .oil-row.oil-a::before { background: #f1c40f; }
      .oil-row.oil-b::before { background: #ff9500; }
      .oil-row.oil-c::before { background: #ff5a5f; }
      .oil-name { font-weight: 700; color: var(--text); margin-bottom: 6px; }
      .oil-desc { color: var(--muted); line-height: 1.4; white-space: pre-line; }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        justify-items: center;
        justify-content: center;
      }

      @media (min-width: 900px) {
        .grid { grid-template-columns: 1fr; }
      }
      .card {
        width: 100%;
        max-width: 760px;
      }

      /* ensure inner blocks also span the centered card width */
      .group { width: 100%; }
      .hour-block { width: auto; }

      .card h2 {
        margin: 0 0 8px 0;
        font-size: clamp(18px, 2.2vw, 20px);
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 16px;
      }

      /* legacy list/grid remnants removed */
      .group {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 8px 0 2px;
      }

      /* unused oil status styles removed */

      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .refresh {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .refresh button {
        appearance: none;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        transition: transform .1s ease, border-color .2s ease;
      }
      .refresh button { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; transition: transform .1s ease, border-color .2s ease, box-shadow .2s ease; }
      .refresh button:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.18); box-shadow: 0 8px 18px rgba(0,0,0,0.32); }
      .refresh .hint { color: var(--muted); font-size: 12px; }

      /* FAQ accordion */
      .faq { width: 100%; max-width: 760px; margin-top: 8px; text-align: left; }
      .faq details { border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04)); box-shadow: var(--shadow); }
      .faq details + details { margin-top: 10px; }
      .faq summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; letter-spacing: -0.01em; }
      .faq summary::-webkit-details-marker { display: none; }
      .faq summary::after { content: '\25BE'; float: right; transition: transform .15s ease; opacity: .8; }
      .faq details[open] summary::after { transform: rotate(180deg); }
      .faq .faq-content { padding: 0 14px 14px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .faq .faq-content p { margin: 8px 0; }
      .faq .faq-content ul { margin: 6px 0 0 18px; padding: 0; }
      .faq .faq-content li { margin: 4px 0; }
      #hourly { scroll-margin-top: 16px; }

      /* Jump button to winners list */
      .jump { display: flex; justify-content: center; }
      .jump-btn { appearance: none; border: 1px solid rgba(0,0,0,0.15); background: linear-gradient(180deg, #ffe680 0%, #ffd54f 60%, #ffca28 100%); color: #111; border-radius: 999px; padding: 10px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 rgba(0,0,0,0.07), var(--shadow); transition: transform .1s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease; font-weight: 600; }
      .jump-btn:hover { transform: translateY(-1px); border-color: rgba(0,0,0,0.22); background: linear-gradient(180deg, #ffdf66 0%, #ffcc3d 60%, #ffb300 100%); box-shadow: 0 8px 18px rgba(0,0,0,0.32); }
      .jump-btn .arrow { font-size: 14px; opacity: .85; animation: arrow-bounce .9s ease-in-out infinite alternate; }
      @keyframes arrow-bounce { from { transform: translateY(-1px); } to { transform: translateY(3px); } }

      /* CTA link to /draw */
      .cta-draw { display: flex; justify-content: center; }
      .cta-btn { appearance: none; border: 1px solid rgba(255,183,77,0.45); background: linear-gradient(180deg, #ffe082 0%, #ffb74d 60%, #ff8a65 100%); color: #000; border-radius: 999px; padding: 12px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 2px 0 rgba(0,0,0,0.08), 0 6px 14px rgba(0,0,0,0.18); transition: transform .1s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease; font-weight: 800; font-size: 15px; text-decoration: none; }
      .cta-btn:hover { transform: translateY(-1px); border-color: rgba(255,183,77,0.6); background: linear-gradient(180deg, #ffecb3 0%, #ffc165 60%, #ff9e80 100%); box-shadow: 0 8px 18px rgba(0,0,0,0.24); }
      .cta-btn .arrow { font-size: 16px; opacity: .9; animation: arrow-move-right .9s ease-in-out infinite alternate; display: inline-flex; align-items: center; }
      .cta-btn .arrow svg { width: 16px; height: 16px; display: block; }
      @keyframes arrow-move-right { from { transform: translateX(0); } to { transform: translateX(5px); } }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <h1>Korean Sesame Oil Winners List</h1>          
        </div>
        <div class="meta">
          <span class="pill" id="next-draw-pill">Until next draw —</span>
        </div>
        <div class="jump">
          <button id="jump-to-winners" type="button" class="jump-btn" title="See winners below">
            <span class="arrow">▼</span>
            <span class="label">See winners below</span>
          </button>
        </div>
        <div class="cta-draw">
          <a href="/draw" id="cta-draw-link" class="cta-btn" title="Join U Mission">
            <span class="label">Missed out? Boost your odds — Join 유 Mission</span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
                <polygon points="3,2 13,8 3,14" fill="currentColor"/>
              </svg>
            </span>
          </a>
        </div>
        <div class="faq" id="faq" hidden></div>
      </header>

      <div class="grid">
        <section class="card">
          <div id="hourly" class="group" aria-live="polite"></div>
          <div id="winners-empty" class="empty" style="display:none;">No winners for this hour.</div>
        </section>
      </div>

      <footer>
        <div class="refresh">
          <button id="refresh-btn" type="button" title="Refresh">Refresh</button>
          <span class="hint">Auto refreshes every minute.</span>
        </div>
        <div>
          <span class="hint">Times are shown in your local timezone.</span>
        </div>
      </footer>
    </div>

    <script>
      const $hourly = document.getElementById('hourly');
      const $winnersEmpty = document.getElementById('winners-empty');
      // removed unused: const $drawPill
      const $nextDraw = document.getElementById('next-draw-pill');
      const $refresh = document.getElementById('refresh-btn');
      const $jump = document.getElementById('jump-to-winners');

      function toLocalHM(dateISO) {
        const d = new Date(dateISO);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const next = new Date(d.getTime()); next.setHours(d.getHours() + 1);
        const hh2 = String(next.getHours()).padStart(2, '0');
        return `${y}.${m}.${dd}. ${hh}:00~${hh2}:00`;
      }

      function toLocalYMDH(dateInput) {
        const d = new Date(dateInput);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        return `${y}.${m}.${dd} ${hh}:00`;
      }

      function maskEmail(v) {
        if (!v || typeof v !== 'string' || !v.includes('@')) return '—';
        const [local, domain] = v.split('@');
        if (local.length <= 2) return `${local[0] || '*'}*@${domain}`;
        const head = local.slice(0, 2);
        const tail = local.slice(-1);
        return `${head}${'*'.repeat(Math.max(1, local.length - 3))}${tail}@${domain}`;
      }

      function maskPhone(v) {
        const s = String(v || '');
        const digits = s.replace(/\D+/g, '');
        if (!digits) return '—';
        if (digits.length <= 3) return '*'.repeat(digits.length);
        return `${'*'.repeat(digits.length - 3)}${digits.slice(-3)}`;
      }

      // 이벤트 창 기준 시간 슬롯 생성 (startUtc 포함, endUtc 미포함)
      function buildEventHourSlots(startUtcISO, endUtcISO) {
        const out = [];
        if (!startUtcISO || !endUtcISO) return out;
        const start = new Date(startUtcISO);
        const end = new Date(endUtcISO);
        // 정각 보정
        start.setMinutes(0, 0, 0);
        end.setMinutes(0, 0, 0);
        for (let t = new Date(start); t < end; t = new Date(t.getTime() + 60 * 60 * 1000)) {
          out.push(new Date(t));
        }
        return out;
      }

      function renderEventSlots(eventInfo, slotsFromApi) {
        $hourly.innerHTML = '';
        const startUtc = eventInfo?.startUtc || null;
        const endUtc = eventInfo?.endUtc || null;
        const frameSlots = buildEventHourSlots(startUtc, endUtc);

        // API 슬롯을 빠르게 조회할 수 있도록 매핑
        const slotMap = new Map();
        if (Array.isArray(slotsFromApi)) {
          for (const s of slotsFromApi) {
            if (!s || !s.hourUtc) continue;
            const key = new Date(s.hourUtc).toISOString().slice(0, 13); // YYYY-MM-DDTHH
            slotMap.set(key, s);
          }
        }

        const now = Date.now();
        for (const slot of frameSlots) {
          const block = document.createElement('div');
          block.className = 'hour-block';
          const title = document.createElement('div');
          title.className = 'hour-title';
          title.textContent = toLocalHM(slot.toISOString());
          block.appendChild(title);

          const key = slot.toISOString().slice(0, 13);
          const slotData = slotMap.get(key);
          const drawAt = new Date(slot.getTime() + 60 * 60 * 1000);
          const isFuture = now < drawAt.getTime();

          if (slotData && Array.isArray(slotData.oils) && slotData.oils.length > 0) {
            slotData.oils.forEach((oil, idx) => {
              const row = document.createElement('div');
              row.className = `oil-row ${['oil-a','oil-b','oil-c'][idx % 3]}`;

              const name = document.createElement('div');
              name.className = 'oil-name';
              name.textContent = oil.oilLabel || 'Oil';
              row.appendChild(name);

              const desc = document.createElement('div');
              desc.className = 'oil-desc';
              if (Array.isArray(oil.winners) && oil.winners.length > 0) {
                const lines = oil.winners.map(w => {
                  const e = (w && w.email) ? w.email : '';
                  const p = (w && w.phone) ? w.phone : '';
                  return [e, p].filter(Boolean).join(' ');
                });
                desc.textContent = lines.join('\n');
              } else {
                desc.textContent = isFuture ? `Scheduled to draw at ${toLocalYMDH(drawAt)}` : 'Draw skipped.';
              }
              row.appendChild(desc);
              block.appendChild(row);
            });
          } else {
            // 슬롯은 있으나 당첨자 없음 표시 (오일 3종 고정 표시)
            const oils = ['Sesame oil 138(Left)', 'Sesame oil 167(Center)', 'Sesame oil 178(Right)'];
            oils.forEach((label, idx) => {
              const row = document.createElement('div');
              row.className = `oil-row ${['oil-a','oil-b','oil-c'][idx]}`;
              const name = document.createElement('div');
              name.className = 'oil-name';
              name.textContent = label;
              row.appendChild(name);
              const desc = document.createElement('div');
              desc.className = 'oil-desc';
              desc.textContent = isFuture ? `Scheduled to draw at ${toLocalYMDH(drawAt)}` : 'Draw skipped.';
              row.appendChild(desc);
              block.appendChild(row);
            });
          }
          $hourly.appendChild(block);
        }
      }

      // OILS 상수는 이벤트 API 렌더링에서 직접 레이블을 사용하므로 제거

      let countdownTimer = null;
      function nextTopOfHourLocal() {
        const d = new Date();
        d.setMinutes(0, 0, 0);
        d.setHours(d.getHours() + 1);
        return d;
      }
      function nextFromDraw() { return nextTopOfHourLocal(); }
      function nextFromNow() {
        return nextTopOfHourLocal();
      }
      function formatRemain(ms) {
        if (ms <= 0) return I18N.copy.winners.soon[I18N.locale];
        const total = Math.floor(ms / 1000);
        const m = Math.floor(total / 60);
        const s = total % 60;
        return I18N.copy.winners.remainFmt(m, s, I18N.locale);
      }
      function startCountdown(target) {
        if (!$nextDraw) return;
        if (countdownTimer) clearInterval(countdownTimer);
        const update = () => {
          const now = Date.now();
          const ms = target.getTime() - now;
          $nextDraw.textContent = `${I18N.copy.winners.nextDrawPrefix[I18N.locale]} ${formatRemain(ms)}`;
        };
        update();
        countdownTimer = setInterval(update, 1000);
      }

      async function load() {
        try {
          const res = await fetch('https://tally-to-d1.gyulkiller.workers.dev/winners/event-masked', { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('네트워크 오류');
          const data = await res.json();

          const eventInfo = data && data.event ? { startUtc: data.event.startUtc, endUtc: data.event.endUtc } : null;
          const slots = Array.isArray(data?.slots) ? data.slots : [];

          // 헤더 표시: 다음 추첨까지 카운트다운
          if ($nextDraw) {
            startCountdown(nextFromDraw());
          }

          // 이벤트 창 기반 렌더링
          $winnersEmpty.style.display = 'none';
          renderEventSlots(eventInfo, slots);
        } catch (e) {
          console.error(e);
          // 오류 시 화면 비움
          $hourly.innerHTML = '';
          $winnersEmpty.style.display = 'block';
          $winnersEmpty.textContent = 'No winners for this hour.';
          startCountdown(nextFromNow());
        }
      }

      $refresh.addEventListener('click', () => load());
      if ($jump) {
        $jump.addEventListener('click', () => {
          const target = document.getElementById('hourly');
          if (target && typeof target.scrollIntoView === 'function') {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      }
      load();
      setInterval(load, 60 * 1000);
    </script>
  </body>
</html>
